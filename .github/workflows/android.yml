name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v3

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 生成签名密钥库
        run: |
          mkdir -p android/app/keystore
          keytool -genkeypair -v -noprompt \
            -keystore android/app/keystore/oldpods.jks \
            -alias oldpods \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass oldpods123 -keypass oldpods123 \
            -dname "CN=OldPods, OU=OldPods, O=OldPods, L=Beijing, S=Beijing, C=CN"

      - name: 显示 Flutter 版本
        run: flutter --version

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 重命名 APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/oldpods-1.0.0-release.apk

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: oldpods-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上传 AAB（可选）
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release
        continue-on-error: true

      - name: 上传 AAB 构件
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: oldpods-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
